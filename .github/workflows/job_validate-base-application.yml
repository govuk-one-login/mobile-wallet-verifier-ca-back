name: Validate Base Application Infrastructure

on:
  workflow_call:
    inputs:
      AWS_REGION:
        description: The AWS region
        type: string
        default: eu-west-2
      TEMPLATE_PATH:
        description: Path to the SAM template
        type: string
        default: base-application.yaml

jobs:
  validate:
    name: 'Validate SAM Template'
    runs-on: ubuntu-24.04
    env:
      SAM_CLI_TELEMETRY: 0
      TEMPLATE_PATH: ${{ inputs.TEMPLATE_PATH }}
      AWS_REGION: ${{ inputs.AWS_REGION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          submodules: true

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3

      - name: SAM Validate
        run: |
          sam validate --lint --template "$TEMPLATE_PATH" --region "$AWS_REGION"

      - name: Run cfn-lint
        run: |
          pip install cfn-lint
          cfn-lint "$TEMPLATE_PATH"
