openapi: 3.0.3
info:
  title: Test DVS CA Backend - Reader Certificate API
  version: '2.0.0'
  description: |
    Issues reader certificates (valid for 90 days) for the Test Verifier.

    The X-Firebase-AppCheck header is a deprecated legacy header. Firebase App
    Check JWT validation is gated behind the
    ENABLE_FIREBASE_APP_CHECK_JWT_VALIDATION feature flag, which is currently
    disabled in all environments for the Reader Auth Trust Anchor Provisioning
    phase. While disabled, the header is optional and its JWT is not verified,
    and requests are accepted or rejected on CSR validity alone.

paths:
  /issue-reader-cert:
    post:
      summary: Issue a reader certificate
      description: |
        Issues an X.509 reader certificate valid for 90 days. Validity is fixed by
        server policy and is not requested by the caller.

        The X-Firebase-AppCheck header is optional and deprecated. It is only
        validated when the ENABLE_FIREBASE_APP_CHECK_JWT_VALIDATION feature flag
        is enabled, which is not the case in any environment during this phase.
      operationId: issueReaderCert
      parameters:
        - name: X-Firebase-AppCheck
          in: header
          required: false
          deprecated: true
          description: Legacy header, retained for backwards compatibility. Not required.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueReaderCertRequest'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri:
          Fn::Sub: 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IssueReaderCertServiceFunction.Arn}:live/invocations'
        passthroughBehavior: when_no_match
      responses:
        '200':
          description: Certificate issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueReaderCertResponse'
        '400':
          description: Invalid request (bad CSR, malformed JSON, missing fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed (App Check token invalid when validation is enabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests (rate limited or throttled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error (e.g., JWKS fetch failure, signing failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    IssueReaderCertRequest:
      type: object
      required:
        - csrPem
      properties:
        csrPem:
          type: string
          description: |
            PKCS#10 Certificate Signing Request in PEM encoding.
            The backend validates:
            - PKCS#10 structure
            - Signature over CertificationRequestInfo
            - Extraction of subject public key
            - Allowed key size and algorithm policy
            - Signature algorithm consistency
            - CSR extension policy for basicConstraints, keyUsage, extendedKeyUsage, and NameConstraints
            - Exact subject fields: C=GB, ST=London, L=London, O=Government Digital Service, and non-empty CN
    IssueReaderCertResponse:
      type: object
      required:
        - certChain
      properties:
        certChain:
          type: string
          description: |
            PEM-encoded certificate chain, leaf first, followed by the issuing
            CA certificates up to and including the Root CA certificate.

            The leaf carries the DVS privacy policy URL in a non-critical Subject
            Information Access (SIA) extension, OID 1.3.6.1.4.1.66559.1.1.
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
